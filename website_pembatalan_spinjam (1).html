<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembatalan SPinjam</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e9eef7);
      color: #1f2937;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 22px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,.10);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e8f7ee;
      font-size: 34px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p {
      margin: 0 auto 24px;
      line-height: 1.6;
      color: #667085;
      max-width: 430px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 8px 20px rgba(37,211,102,.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(37,211,102,.32);
    }
    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #98a2b3;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📋</div>
    <h1>Pembatalan SPinjam</h1>
    <p>
      Untuk mengetahui langkah-langkah pengajuan pembatalan SPinjam,
      silakan hubungi layanan bantuan melalui WhatsApp.
    </p>

    <a class="btn" href="https://wa.me/628111070113" target="_blank" rel="noopener">
      💬 Hubungi Bantuan via WhatsApp
    </a>

    <div class="small">Layanan bantuan: 0811-1070-113</div>
  </main>
</body>
</html>
